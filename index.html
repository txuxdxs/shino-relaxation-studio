<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#21172c"><title>藤崎紫乃｜Relaxation Studio</title>
<style>
:root{--ink:#292333;--muted:#887e91;--pink:#d88eae;--paper:#fffaff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(145deg,#f8eff8,#eeeafa 55%,#fdf6f3)}
body{min-height:100dvh}.app{max-width:760px;margin:auto;padding:18px 16px 30px}
header{text-align:center;padding:12px 0 16px}header .eyebrow{letter-spacing:.22em;font-size:11px;color:#9c7898}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(28px,7vw,40px);margin:5px 0}header p{margin:5px;color:var(--muted);font-size:13px}
.stage{height:min(62dvh,620px);min-height:360px;position:relative;overflow:hidden;border:1px solid #fff;border-radius:28px;background:radial-gradient(ellipse at 50% 38%,#fff 0,#fbf5ff 48%,#e9e1f2 100%);box-shadow:0 16px 45px #4c31531c;touch-action:none;user-select:none}
.stage:before{content:"";position:absolute;inset:18px;border:1px solid #d8c8df88;border-radius:20px;pointer-events:none}
.glow{position:absolute;width:65%;height:28%;left:17.5%;bottom:5%;background:#bca6d433;filter:blur(30px);border-radius:50%}
.character{position:absolute;left:50%;top:50%;width:min(72%,390px);height:90%;transform:translate(-50%,-50%) scale(1);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.character img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 10px 12px #3c2b4020)}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;padding:24px;color:#8b7895}.avatar{font-size:96px}.placeholder b{font-size:20px;color:#594b66}.placeholder small{margin-top:8px;line-height:1.8}
.expression{position:absolute;top:10px;right:14px;padding:8px 13px;border-radius:99px;background:#fffD;border:1px solid #eaddec;color:#826c8c;font-size:12px}
.tools{position:absolute;left:12px;bottom:12px;display:flex;gap:7px}.tool,.outfit,.expression-btn,.action{border:1px solid #e8ddea;background:#fff;border-radius:99px;padding:9px 12px;color:#67566f;font-size:12px}
.panel{background:#fffC;border:1px solid #fff;border-radius:20px;padding:15px;margin-top:14px;box-shadow:0 8px 25px #4c31530d}.panel h2{font-size:15px;margin:0 0 12px}
.outfits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.outfit{border-radius:13px;padding:10px 4px}.outfit.active,.expression-btn.active{border:2px solid var(--pink);background:#fff5fa;color:#9b5879;font-weight:700}
.expressions,.actions{display:flex;flex-wrap:wrap;gap:8px}.hint{font-size:12px;line-height:1.7;color:#8d8292;margin:10px 2px 0}
.upload{display:block;width:100%;padding:12px;border:1px dashed #cdbbd3;border-radius:12px;background:#fff;color:#786780;font-size:13px}input[type=file]{display:none}.footer{text-align:center;color:#a196a8;font-size:11px;padding:20px}
@media(max-width:430px){.app{padding:10px 12px 24px}.stage{min-height:380px;height:59dvh}.outfit{padding:9px 2px;font-size:11px}}
</style></head><body><main class="app">
<header><div class="eyebrow">FUJISAKI SHINO</div><h1>Relaxation Studio</h1><p>紫乃と、ゆったり過ごすひととき。</p></header>
<section class="stage" id="stage"><div class="glow"></div><div class="character" id="character"><div class="placeholder" id="placeholder"><div class="avatar">👩🏻‍🦰</div><b>藤崎 紫乃</b><small>下の「画像を登録」から衣装画像を読み込んでな。</small></div><img id="portrait" alt="藤崎紫乃" hidden></div><div class="expression" id="expressionLabel">😊 笑顔</div><div class="tools"><button class="tool" id="zoomOut">－</button><button class="tool" id="zoomReset">リセット</button><button class="tool" id="zoomIn">＋</button></div></section>
<section class="panel"><h2>衣装を選ぶ</h2><div class="outfits" id="outfits"></div><p class="hint">オフィス・バニー・ランジェリー・ニット・水着・メイド・ナース・ワンピース</p></section>
<section class="panel"><h2>表情を選ぶ</h2><div class="expressions" id="expressions"></div></section>
<section class="panel"><h2>画像を登録</h2><label class="upload" for="imageUpload">＋ 8枚の衣装画像を選択（複数選択OK）</label><input id="imageUpload" type="file" accept="image/*" multiple><p class="hint">8枚セットを保存して、ここから選択してな。画像はこの端末のブラウザ内に保存されるで。</p></section>
<section class="panel"><h2>操作</h2><div class="actions"><button class="action" id="center">紫乃を中央に戻す</button></div><p class="hint">紫乃を指でドラッグして移動。2本指でピンチすると拡大・縮小。タップでも表情が切り替わるで。</p></section><div class="footer">FUJISAKI SHINO · RELAXATION STUDIO</div>
</main><script>
const names=['オフィス','バニー','ランジェリー','ニット','水着','メイド','ナース','ワンピース'],faces=['笑顔','照れ顔','むすっ','ウインク','びっくり','目を閉じる'],icons=['😊','☺️','😠','😉','😳','😌'];let imgs=Array(8).fill(null),outfit=0,face=0,scale=1,x=0,y=0,pts=new Map(),drag=null,pinch=null;
const $=id=>document.getElementById(id),ch=$('character');
function outfits(){ $('outfits').innerHTML='';names.forEach((n,i)=>{let b=document.createElement('button');b.className='outfit'+(i===outfit?' active':'');b.textContent=n;b.onclick=()=>{outfit=i;outfits();show()};$('outfits').append(b)})}
function show(){if(imgs[outfit]){$('portrait').src=imgs[outfit];$('portrait').hidden=false;$('placeholder').hidden=true}else{$('portrait').hidden=true;$('placeholder').hidden=false}}
function faces(){ $('expressions').innerHTML='';facesList.forEach((n,i)=>{let b=document.createElement('button');b.className='expression-btn'+(i===face?' active':'');b.textContent=icons[i]+' '+n;b.onclick=()=>setFace(i);$('expressions').append(b)})}
const facesList=faces;
function setFace(i){face=i;$('expressionLabel').textContent=icons[i]+' '+facesList[i];faces()}
function transform(){ch.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`}
function reset(){x=0;y=0;scale=1;transform()}
$('zoomIn').onclick=()=>{scale=Math.min(2.6,scale*1.15);transform()};$('zoomOut').onclick=()=>{scale=Math.max(.55,scale*.87);transform()};$('zoomReset').onclick=reset;$('center').onclick=reset;
$('stage').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();$('stage').setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1)drag={x:e.clientX,y:e.clientY,ox:x,oy:y};else if(pts.size===2){let a=[...pts.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),s:scale}}});
$('stage').addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&drag){x=drag.ox+e.clientX-drag.x;y=drag.oy+e.clientY-drag.y;transform()}else if(pts.size===2&&pinch){let a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale=Math.max(.55,Math.min(2.6,pinch.s*d/pinch.d));transform()}});
function end(e){let tap=pts.size===1&&drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8;pts.delete(e.pointerId);drag=null;pinch=null;if(tap)setFace((face+1)%facesList.length)}
$('stage').addEventListener('pointerup',end);$('stage').addEventListener('pointercancel',end);
$('imageUpload').onchange=async e=>{let fs=[...e.target.files].filter(f=>f.type.startsWith('image/')).slice(0,8);for(let i=0;i<fs.length;i++)imgs[i]=await new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(fs[i])});try{localStorage.setItem('shinoOutfits',JSON.stringify(imgs))}catch(err){alert('画像容量が大きく保存できない場合があるで')}show();outfits();e.target.value='';alert(fs.length+'枚読み込んだで！')};
try{let a=JSON.parse(localStorage.getItem('shinoOutfits')||'null');if(Array.isArray(a)&&a.length===8)imgs=a}catch(e){}outfits();faces();show();transform();
</script></body></html>
