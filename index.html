<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#21172c"><title>藤崎紫乃｜Relaxation Studio</title>
<style>
:root{--ink:#292333;--muted:#887e91;--pink:#d88eae}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(145deg,#f8eff8,#eeeafa 55%,#fdf6f3)}body{min-height:100dvh}.app{max-width:760px;margin:auto;padding:14px 14px 28px}header{text-align:center;padding:8px 0 14px}header .eyebrow{letter-spacing:.22em;font-size:11px;color:#9c7898}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(27px,7vw,39px);margin:5px 0}header p{margin:5px;color:var(--muted);font-size:13px}.stage{height:min(64dvh,660px);min-height:390px;position:relative;overflow:hidden;border:1px solid #fff;border-radius:26px;background:radial-gradient(ellipse at 50% 38%,#fff 0,#fbf5ff 48%,#e9e1f2 100%);box-shadow:0 16px 45px #4c31531c;touch-action:none;user-select:none}.stage:before{content:"";position:absolute;inset:16px;border:1px solid #d8c8df88;border-radius:20px;pointer-events:none}.glow{position:absolute;width:65%;height:25%;left:17.5%;bottom:5%;background:#bca6d433;filter:blur(30px);border-radius:50%}.character{position:absolute;left:50%;top:50%;width:min(78%,440px);height:94%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}.character img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 10px 12px #3c2b4020)}.expression{position:absolute;top:10px;right:14px;padding:8px 13px;border-radius:99px;background:#fffE;border:1px solid #eaddec;color:#826c8c;font-size:12px}.tools{position:absolute;left:12px;bottom:12px;display:flex;gap:7px}.tool,.outfit,.expression-btn,.action{border:1px solid #e8ddea;background:#fff;border-radius:99px;padding:9px 12px;color:#67566f;font-size:12px}.panel{background:#fffC;border:1px solid #fff;border-radius:20px;padding:15px;margin-top:13px;box-shadow:0 8px 25px #4c31530d}.panel h2{font-size:15px;margin:0 0 12px}.outfits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.outfit{border-radius:13px;padding:10px 4px}.outfit.active,.expression-btn.active{border:2px solid var(--pink);background:#fff5fa;color:#9b5879;font-weight:700}.expressions,.actions{display:flex;flex-wrap:wrap;gap:8px}.hint{font-size:12px;line-height:1.7;color:#8d8292;margin:10px 2px 0}.footer{text-align:center;color:#a196a8;font-size:11px;padding:20px}@media(max-width:430px){.stage{min-height:390px;height:61dvh}.outfit{padding:9px 2px;font-size:11px}}
</style></head><body><main class="app">
<header><div class="eyebrow">FUJISAKI SHINO</div><h1>Relaxation Studio</h1><p>紫乃と、ゆったり過ごすひととき。</p></header>
<section class="stage" id="stage"><div class="glow"></div><div class="character" id="character"><img id="portrait" src="01_office.png" alt="藤崎紫乃"></div><div class="expression" id="expressionLabel">😊 笑顔</div><div class="tools"><button class="tool" id="zoomOut">－</button><button class="tool" id="zoomReset">リセット</button><button class="tool" id="zoomIn">＋</button></div></section>
<section class="panel"><h2>衣装を選ぶ</h2><div class="outfits" id="outfits"></div><p class="hint">8種類の衣装を切り替えられるで。</p></section>
<section class="panel"><h2>表情を選ぶ</h2><div class="expressions" id="expressions"></div><p class="hint">表情の切り替え操作を搭載。表情専用画像の差し替えは次の仕上げで追加するで。</p></section>
<section class="panel"><h2>操作</h2><div class="actions"><button class="action" id="center">紫乃を中央に戻す</button></div><p class="hint">紫乃を指でドラッグして移動。2本指でピンチすると拡大・縮小。タップでも表情が切り替わるで。</p></section><div class="footer">FUJISAKI SHINO · RELAXATION STUDIO</div>
</main><script>
const outfits=[['オフィス','01_office.png'],['バニー','02_bunny.png'],['ランジェリー','03_lingerie.png'],['ニット','04_knit.png'],['水着','05_swimsuit.png'],['メイド','06_maid.png'],['ナース','07_nurse.png'],['ワンピース','08_onepiece.png']];
const faceNames=['笑顔','照れ顔','むすっ','ウインク','びっくり','目を閉じる'];const faceIcons=['😊','☺️','😠','😉','😳','😌'];let outfitIndex=0,faceIndex=0,scale=1,x=0,y=0,pointers=new Map(),drag=null,pinch=null;
const $=id=>document.getElementById(id),character=$('character');
function renderOutfits(){$('outfits').innerHTML='';outfits.forEach(([name,file],i)=>{const b=document.createElement('button');b.className='outfit'+(i===outfitIndex?' active':'');b.textContent=name;b.onclick=()=>{outfitIndex=i;$('portrait').src=file;renderOutfits()};$('outfits').append(b)})}
function renderFaces(){$('expressions').innerHTML='';faceNames.forEach((name,i)=>{const b=document.createElement('button');b.className='expression-btn'+(i===faceIndex?' active':'');b.textContent=faceIcons[i]+' '+name;b.onclick=()=>setFace(i);$('expressions').append(b)})}
function setFace(i){faceIndex=i;$('expressionLabel').textContent=faceIcons[i]+' '+faceNames[i];renderFaces()}
function transform(){character.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`}
function reset(){x=0;y=0;scale=1;transform()}
$('zoomIn').onclick=()=>{scale=Math.min(2.6,scale*1.15);transform()};$('zoomOut').onclick=()=>{scale=Math.max(.55,scale*.87);transform()};$('zoomReset').onclick=reset;$('center').onclick=reset;
$('stage').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();$('stage').setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY,ox:x,oy:y};else if(pointers.size===2){const a=[...pointers.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),s:scale}}});
$('stage').addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){x=drag.ox+e.clientX-drag.x;y=drag.oy+e.clientY-drag.y;transform()}else if(pointers.size===2&&pinch){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale=Math.max(.55,Math.min(2.6,pinch.s*d/pinch.d));transform()}});
function end(e){const tap=pointers.size===1&&drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8;pointers.delete(e.pointerId);drag=null;pinch=null;if(tap)setFace((faceIndex+1)%faceNames.length)}$('stage').addEventListener('pointerup',end);$('stage').addEventListener('pointercancel',end);
renderOutfits();renderFaces();transform();
</script></body></html>
